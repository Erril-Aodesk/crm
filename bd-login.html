<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AODesk BD — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#080F26;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
canvas{position:absolute;inset:0;opacity:.4;pointer-events:none;}
.card{position:relative;z-index:2;width:440px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:28px;padding:48px 42px;backdrop-filter:blur(24px);box-shadow:0 40px 80px rgba(0,0,0,.5);animation:up .5s cubic-bezier(.16,1,.3,1);}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:36px;}
.bmark{width:44px;height:44px;background:linear-gradient(135deg,#2352E8,#3B82F6);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:white;box-shadow:0 8px 20px rgba(35,82,232,.4);}
.btext{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;color:white;line-height:1.1;}
.btext span{display:block;font-size:10px;font-weight:400;color:rgba(255,255,255,.35);letter-spacing:.07em;text-transform:uppercase;margin-top:2px;}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;color:white;margin-bottom:6px;}
.sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:28px;}
.field{margin-bottom:16px;}
label{display:block;font-size:11px;font-weight:500;color:rgba(255,255,255,.4);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;}
input{width:100%;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.08);border-radius:10px;padding:13px 16px;color:white;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
input:focus{border-color:#2352E8;}
input::placeholder{color:rgba(255,255,255,.2);}
.btn-login{width:100%;margin-top:6px;background:linear-gradient(135deg,#2352E8,#3B82F6);color:white;border:none;border-radius:11px;padding:14px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(35,82,232,.4);transition:all .15s;}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 10px 32px rgba(35,82,232,.5);}
.err{display:none;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.25);color:#FCA5A5;border-radius:9px;padding:10px 14px;font-size:13px;margin-top:12px;text-align:center;}
.err.show{display:block;}
.footer{margin-top:28px;text-align:center;font-size:11px;color:rgba(255,255,255,.12);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="card">
  <div class="brand">
    <div class="bmark">A</div>
    <div class="btext">AODesk BD Portal<span>Business Development System</span></div>
  </div>
  <h1>Sign in</h1>
  <p class="sub">Enter your credentials to access your dashboard.</p>
  <div class="demo-box">
    🎯 <strong>Demo accounts</strong><br/>
    👔 GM &nbsp;— gm@aodesk.com.au / gm1234<br/>
    📈 BDM — bdm@aodesk.com.au / bdm1234<br/>
    💻 IT &nbsp;&nbsp;— it@aodesk.com.au / it1234
  </div>
  <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@aodesk.com.au"/></div>
  <div class="field"><label>Password</label><input type="password" id="pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/></div>
  <button class="btn-login" id="loginBtn" onclick="login()">Sign In →</button>
  <div class="err" id="err"></div>
  <div class="footer">Australian Outsource Desk Inc. · Confidential</div>
</div>
<script>
const SUPABASE_URL='https://ioizmqqujnypodawlmag.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlvaXptcXF1am55cG9kYXdsbWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MjU2NjQsImV4cCI6MjA5NTMwMTY2NH0.Uyp-D9LalhWs2J4vesZbEKsIQCDCWKWI9BKD9Zck_No';
const DEMO={'gm@aodesk.com.au':{pass:'gm1234',role:'gm',name:'General Manager'},'bdm@aodesk.com.au':{pass:'bdm1234',role:'bdm',name:'BD Manager'},'it@aodesk.com.au':{pass:'it1234',role:'it',name:'IT Admin'}};
const PAGES={gm:'bd-gm.html',bdm:'bd-bdm.html',it:'bd-it.html'};

async function login(){
  const email=document.getElementById('email').value.trim(), pw=document.getElementById('pw').value;
  const err=document.getElementById('err'), btn=document.getElementById('loginBtn');
  err.classList.remove('show');
  if(!email||!pw){showErr('Please enter email and password.');return;}
  btn.textContent='Signing in...';btn.disabled=true;

  // ── DEMO ACCOUNTS ──
  if(DEMO[email]){
    if(pw!==DEMO[email].pass){showErr('Incorrect password.');btn.textContent='Sign In →';btn.disabled=false;return;}
    localStorage.removeItem('bd_leadgen');localStorage.removeItem('bd_pipeline');
    sessionStorage.setItem('bd_token','demo_token');
    sessionStorage.setItem('bd_role',DEMO[email].role);
    sessionStorage.setItem('bd_user',JSON.stringify({email,name:DEMO[email].name}));
    window.location.href=PAGES[DEMO[email].role];return;
  }

  // ── REAL SUPABASE AUTH ──
  try{
    const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({email,password:pw})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error_description||'Login failed');
    const userRole=data.user?.user_metadata?.role;
    if(!userRole)throw new Error('No role assigned. Contact your administrator.');
    sessionStorage.setItem('bd_token',data.access_token);
    sessionStorage.setItem('bd_role',userRole);
    sessionStorage.setItem('bd_user',JSON.stringify({email:data.user.email,name:data.user.user_metadata?.full_name||email.split('@')[0]}));
    window.location.href=PAGES[userRole]||'bd-gm.html';
  }catch(e){showErr(e.message);btn.textContent='Sign In →';btn.disabled=false;}
}
function showErr(msg){const e=document.getElementById('err');e.textContent=msg;e.classList.add('show');}
// particles
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,pts=[];
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;pts=Array.from({length:55},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}));}
resize();window.addEventListener('resize',resize);
function draw(){ctx.clearRect(0,0,W,H);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,1.5,0,Math.PI*2);ctx.fillStyle='rgba(59,130,246,.5)';ctx.fill();});pts.forEach((a,i)=>pts.slice(i+1).forEach(b=>{const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(59,130,246,${.15*(1-d/120)})`;ctx.stroke();}}));requestAnimationFrame(draw);}
draw();
</script>
</body>
</html>
